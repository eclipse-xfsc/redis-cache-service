  #   depends_on:
  #     redis:
  #       condition: service_healthy
  #     nats:
  #       condition: service_healthy
  #   restart: on-failure
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--requirepass", "localtest"]
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "localtest", "ping"]
      interval: 3s
      timeout: 3s
      retries: 15
  nats:
    image: nats:2.10-alpine
    ports:
      - "127.0.0.1:4222:4222"
    healthcheck:
      test: ["CMD", "nats-server", "--help"]
      interval: 5s
      timeout: 3s
      retries: 5
