{{- $annotations := default dict .Values.podAnnotations -}}
{{- $injectionEnabled := eq (default "false" (index $annotations "inject.xfsc.io/enabled")) "true" -}}
{{- if and $injectionEnabled .Values.resourceClaim.redis.enabled }}
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ printf "%s-redis-credentials" .Release.Name | quote }}
  namespace: {{ .Release.Namespace }}
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: openbao
    kind: SecretStore
  target:
    name: {{ printf "%s-redis-credentials" .Release.Name | quote }}
    creationPolicy: Owner
    deletionPolicy: Delete
  data:
    - secretKey: username
      remoteRef:
        key: "ocm-wstack/system/cache"
        property: username
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
        nullBytePolicy: Ignore
    - secretKey: password
      remoteRef:
        key: "ocm-wstack/system/cache"
        property: password
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
        nullBytePolicy: Ignore
{{- end }}
