{{- $annotations := default dict .Values.podAnnotations -}}
{{- $injectionEnabled := eq (default "false" (index $annotations "inject.xfsc.io/enabled")) "true" -}}
{{- if and $injectionEnabled .Values.resourceClaim.redis.enabled }}
apiVersion: resources.xfsc.io/v1alpha1
kind: ResourceClaim
metadata:
  name: {{ printf "%s-redis-resource-claim" .Release.Name | quote }}
  namespace: {{ .Release.Namespace }}
spec:
  type: redis
  providerRef:
    name: {{ .Values.resourceClaim.redis.providerRef | quote }}
  externalSecretRef:
    name: {{ printf "%s-redis-credentials" .Release.Name | quote }}
  parameters:
    database: {{ .Values.resourceClaim.redis.database | int }}
    acl:
      keys:
        {{- toYaml .Values.resourceClaim.redis.acl.keys | nindent 8 }}
{{- end }}
