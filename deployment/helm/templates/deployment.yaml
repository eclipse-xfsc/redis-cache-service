{{- $annotations := default dict .Values.podAnnotations -}}
{{- $injected := eq (toString (default "false" (index $annotations "inject.xfsc.io/enabled"))) "true" -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "app.name" . | quote }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "app.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      {{- include "app.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "app.labels" . | nindent 8 }}
      {{- if or .Values.metrics.enabled $annotations }}
      annotations:
        {{- include "app.metricsAnnotations" . | nindent 8 }}
        {{- with $annotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- end }}
    spec:
      securityContext:
        {{- include "app.securitycontext" . | nindent 8 }}
      {{- with .Values.image.pullSecrets }}
      imagePullSecrets:
        - name: {{ . | quote }}
      {{- end }}
      containers:
        - name: {{ include "app.name" . }}
          image: {{ include "app.image" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy | quote }}
          {{- if .Values.useSecretRef }}
          envFrom:
            - secretRef:
                name: {{ .Values.secretRefName | quote }}
          {{- else if .Values.useConfigMap }}
          envFrom:
            - configMapRef:
                name: {{ .Values.configMapName | quote }}
          {{- end }}
          env:
            - name: LOG_LEVEL
              value: {{ .Values.log.level | default "INFO" | quote }}
            - name: LOG_ENCODING
              value: {{ .Values.log.encoding | default "json" | quote }}
            - name: HTTP_HOST
              value: {{ .Values.cache.http.host | quote }}
            - name: HTTP_PORT
              value: {{ .Values.cache.http.port | quote }}
            - name: HTTP_IDLE_TIMEOUT
              value: {{ .Values.cache.http.timeout.idle | quote }}
            - name: HTTP_READ_TIMEOUT
              value: {{ .Values.cache.http.timeout.read | quote }}
            - name: HTTP_WRITE_TIMEOUT
              value: {{ .Values.cache.http.timeout.write | quote }}
            - name: REDIS_DB
              value: {{ .Values.redis.db | quote }}
            - name: REDIS_EXPIRATION
              value: {{ .Values.redis.expiration | quote }}
            - name: REDIS_CLUSTER
              value: {{ .Values.redis.cluster | default false | quote }}
            - name: NATS_SUBJECT
              value: {{ .Values.cache.nats.subject | quote }}
            {{- if not $injected }}
            - name: REDIS_ADDR
              value: {{ .Values.redis.addr | quote }}
            {{- with .Values.redis.user }}
            - name: REDIS_USER
              value: {{ . | quote }}
            {{- end }}
            {{- with .Values.redis.pass }}
            - name: REDIS_PASS
              value: {{ . | quote }}
            {{- end }}
            - name: NATS_ADDR
              value: {{ .Values.cache.nats.url | quote }}
            {{- end }}
            {{- range $key, $ref := .Values.secretEnv }}
            - name: {{ $key | quote }}
              valueFrom:
                secretKeyRef:
                  name: {{ $ref.name | quote }}
                  key: {{ $ref.key | quote }}
            {{- end }}
            {{- with .Values.extraVars }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          ports:
            - name: http
              containerPort: {{ .Values.cache.http.port }}
            {{- if .Values.metrics.enabled }}
            - name: monitoring
              containerPort: {{ .Values.metrics.port }}
            {{- end }}
          readinessProbe:
            httpGet:
              path: /readiness
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
            successThreshold: 2
            failureThreshold: 2
            timeoutSeconds: 5
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
